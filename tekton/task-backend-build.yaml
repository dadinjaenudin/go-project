apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: backend-build-push
  namespace: cicd

spec:
  description: Build image backend dengan Kaniko lalu push ke Docker Hub.

  params:
    - name: IMAGE
      type: string
      description: Repositori image, mis. dadin/go-backend

    - name: TAG
      type: string

  workspaces:
    - name: source

  results:
    - name: digest
      description: Digest image hasil push

  steps:
    - name: build-push
      image: gcr.io/kaniko-project/executor:v1.23.2

      args:
        - --dockerfile=$(workspaces.source.path)/Dockerfile-go
        - --context=$(workspaces.source.path)
        - --destination=docker.io/$(params.IMAGE):$(params.TAG)
        - --destination=docker.io/$(params.IMAGE):latest
        - --digest-file=$(results.digest.path)
        - --cache=true
        - --cache-ttl=24h

      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker

  volumes:
    - name: docker-config
      secret:
        secretName: dockerhub-secret
        items:
          - key: .dockerconfigjson
            path: config.json
