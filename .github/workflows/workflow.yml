name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # BACKEND - mirror task Tekton backend-test
  # ==========================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build server binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -v -o /tmp/server main.go

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  # ==========================================
  # DOCKER - build saja, tanpa push.
  # Push ke Docker Hub adalah tugas pipeline
  # Tekton (Kaniko), bukan CI ini.
  # ==========================================
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile-go -t go-project_backend:ci .

      - name: Build frontend image
        run: docker build -f ui/Dockerfile-vue -t go-project_frontend:ci ui

  # ==========================================
  # MANIFEST - non-blocking. Memverifikasi
  # setiap path k8s/ yang di-apply deploy.yaml
  # benar-benar ada di repo.
  # ==========================================
  manifests:
    name: Manifest paths (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Check paths referenced by Tekton deploy task
        run: |
          missing=0

          for path in $(grep -oE 'k8s/[A-Za-z0-9_.-]+' deploy.yaml | sort -u); do
            if [ -f "$path" ]; then
              echo "OK      $path"
            else
              echo "MISSING $path"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing manifest tidak ditemukan - step deploy Tekton akan gagal."
            exit 1
          fi
