server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Komponen memanggil "/api/data" relatif. nginx meneruskannya ke Service
    # backend di namespace yang sama, sehingga tidak perlu CORS maupun URL
    # absolut yang menyebut localhost.
    location /api/ {
        proxy_pass http://employee-backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nama file aset mengandung hash isi (index-pVhcWoCt.js), jadi isinya
    # tidak pernah berubah untuk nama yang sama -- aman di-cache selamanya.
    # Tanpa "expires": directive itu mengirim Cache-Control sendiri, sehingga
    # header jadi dobel dan browser memakai yang pertama -- yang tidak memuat
    # "immutable".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html WAJIB tidak di-cache. Isinya menunjuk nama bundle yang berubah
    # tiap build. Kalau browser menyimpannya, ia terus meminta bundle versi lama
    # yang sudah tidak ada di image baru -- pengguna melihat halaman lama, atau
    # halaman kosong karena SPA fallback mengembalikan HTML saat browser
    # mengharapkan JavaScript.
    #
    # nginx tanpa baris ini tidak mengirim Cache-Control sama sekali, dan browser
    # memakai heuristik cache-nya sendiri.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
