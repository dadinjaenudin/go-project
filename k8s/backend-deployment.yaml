apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-backend
  namespace: dev
  labels:
    app: employee-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employee-backend

  template:
    metadata:
      labels:
        app: employee-backend

    spec:
      containers:
        - name: backend
          # Tag diganti saat deploy oleh task Tekton (kubectl set image).
          image: dadin/go-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8888

          # CSV sudah ikut di dalam image, jadi tidak ada volume/ConfigMap.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
